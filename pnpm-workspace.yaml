packages:
  - "apps/*"
  - "packages/*"

# pnpm 10.x: packages allowed to run install scripts.
allowBuilds:
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

# Single source of dependency versions. Every workspace references
# `catalog:` (third-party) or `workspace:*` (internal), never a literal range.
catalog:
  # build tooling
  typescript: 5.9.3
  turbo: ^2.11.2
  lefthook: ^2.1.14
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  eslint: 10.7.0
  jiti: ^2.7.0
  "@eslint/js": 10.0.1
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.3
  globals: 17.7.0
  typescript-eslint: 8.64.0
  shadcn: ^4.20.1
  sharp: ^0.35.3

  # bundler / test runner
  vite: ^8.1.4
  "@vitejs/plugin-react": 6.0.3
  "@playwright/test": ^1.61.1

  # cloudflare
  wrangler: 4.110.0
  "@cloudflare/vite-plugin": 1.44.0
  "@cloudflare/ai-chat": ^0.9.3
  agents: ^0.17.4
  workers-ai-provider: ^3.3.1

  # react
  react: 19.2.7
  react-dom: 19.2.7
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  react-router-dom: ^7.18.1

  # node / misc types
  "@types/node": 26.1.1
  "@types/chrome": ^0.2.2
  "@types/qrcode": ^1.5.6

  # tailwind
  tailwindcss: ^4.3.2
  "@tailwindcss/vite": ^4.3.2
  tw-animate-css: ^1.4.0

  # ui — shadcn radix-maia surface (umbrella radix-ui package)
  radix-ui: ^1.6.2
  lucide-react: ^1.24.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  cmdk: ^1.1.1
  sonner: ^2.0.7
  next-themes: ^0.4.6
  react-day-picker: ^10.0.1
  recharts: ^3.9.2
  react-hotkeys-hook: ^5.3.3
  use-stick-to-bottom: ^1.1.6
  date-fns: ^4.4.0
  "@fontsource-variable/geist": ^5.2.9
  "@fontsource-variable/geist-mono": ^5.2.8
  "@fullcalendar/core": ^6.1.21
  "@fullcalendar/daygrid": ^6.1.21
  "@fullcalendar/interaction": ^6.1.21
  "@fullcalendar/react": ^6.1.21
  "@fullcalendar/timegrid": ^6.1.21
  qrcode: ^1.5.4
  idb: ^8.0.3
  zustand: ^5.0.14

  # tanstack
  "@tanstack/react-query": ^5.101.2
  "@tanstack/react-query-devtools": ^5.101.2

  # web / worker
  hono: 4.12.30
  "@hono/zod-validator": ^0.8.0
  zod: ^4.4.3
  better-auth: ^1.6.23
  "@better-auth/passkey": ^1.6.23
  "@modelcontextprotocol/sdk": 1.29.0
  mimetext: ^3.0.28
  react-email: ^6.9.0
  "@react-email/ui": ^6.9.0

  # ai — @cloudflare/ai-chat peers ai ^6, NOT v7
  ai: ^6.0.230
  "@ai-sdk/react": ^3.0.232
