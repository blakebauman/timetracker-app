packages:
  - "apps/*"
  - "packages/*"

# pnpm 10.x: packages allowed to run install scripts.
allowBuilds:
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

# Single source of dependency versions. Every workspace references
# `catalog:` (third-party) or `workspace:*` (internal), never a literal range.
catalog:
  # build tooling
  typescript: 5.9.3
  turbo: ^2.11.9
  lefthook: ^2.2.2
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  eslint: 10.13.0
  jiti: ^2.7.0
  "@eslint/js": 10.0.1
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.7.0
  typescript-eslint: 8.71.2
  shadcn: ^4.21.0
  sharp: ^0.35.5

  # bundler / test runner
  vite: ^8.3.2
  "@vitejs/plugin-react": 6.1.2
  "@playwright/test": ^1.64.1

  # cloudflare
  wrangler: 4.151.1
  "@cloudflare/vite-plugin": 1.64.0
  "@cloudflare/ai-chat": ^0.12.1
  agents: ^0.30.0
  workers-ai-provider: ^4.0.1

  # react
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react-router-dom: ^7.18.4

  # node / misc types
  "@types/node": 26.1.1
  "@types/chrome": ^0.2.2
  "@types/qrcode": ^1.5.6

  # tailwind
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0

  # ui — shadcn radix-maia surface (umbrella radix-ui package)
  radix-ui: ^1.6.7
  lucide-react: ^1.24.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  cmdk: ^1.1.1
  sonner: ^2.0.7
  next-themes: ^0.4.6
  react-day-picker: ^10.0.1
  recharts: ^3.10.1
  react-hotkeys-hook: ^5.3.3
  use-stick-to-bottom: ^1.1.6
  date-fns: ^4.4.0
  "@fontsource-variable/geist": ^5.2.9
  "@fontsource-variable/geist-mono": ^5.2.8
  "@fullcalendar/react": ^7.1.1
  temporal-polyfill: ^1.0.5
  qrcode: ^1.5.4
  idb: ^8.0.3
  zustand: ^5.0.16

  # tanstack
  "@tanstack/react-query": ^5.104.4
  "@tanstack/react-query-devtools": ^5.101.2

  # web / worker
  hono: 4.13.13
  "@hono/zod-validator": ^0.9.1
  zod: ^4.4.3
  better-auth: ^1.7.6
  "@better-auth/passkey": ^1.7.6
  # The /mcp server is on the v2 package. `agents` still imports the v1
  # package's types from its core (the Assistant's ChatAgent), so v1 stays
  # installed at the exact version agents peers on.
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/sdk": 1.32.1
  mimetext: ^3.0.28
  react-email: ^6.11.3
  "@react-email/ui": ^6.11.3

  # ai v7 — workers-ai-provider 4 requires it; @cloudflare/ai-chat peers ^6 || ^7
  ai: ^7.0.150
  "@ai-sdk/react": ^4.0.154

peerDependencyRules:
  allowedVersions:
    # agents pins @modelcontextprotocol/server 2.0.0 exactly, but only its
    # agents/mcp handler imports it, and this app serves /mcp with the SDK's
    # own createMcpHandler instead.
    agents>@modelcontextprotocol/server: 2.x

# Security floors for transitive dependencies, each within its current major,
# from open Dependabot alerts. Nearly all are dev tooling (the shadcn CLI,
# miniflare, the react-email preview). Drop an entry once its parent
# ships the patched version itself.
overrides:
  undici@>=7.0.0 <7.29.1: ^7.29.1
  fast-uri@>=3.0.0 <3.1.7: ^3.1.7
  qs@<6.16.0: ^6.16.0
  ip-address@<10.7.1: ^10.7.1
  browserslist@<4.28.7: ^4.28.7
  postcss@<8.5.23: ^8.5.23
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  baseline-browser-mapping@<2.11.0: ^2.11.0
  "@hono/node-server@<1.19.15": ^1.19.15
  source-map-js@<1.2.2: ^1.2.2
  sharp@<0.35.5: ^0.35.5
  engine.io@>=6.6.0 <6.6.10: ^6.6.10
  proxy-addr@<2.0.8: ^2.0.8
