name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The `e2e` job is a required branch-protection check — keep its id stable.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @timetracker/web exec playwright install --with-deps chromium

      - name: Write dev vars
        working-directory: apps/web
        run: |
          cat > .dev.vars <<'EOF'
          BETTER_AUTH_SECRET=ci-test-secret-at-least-32-characters-long
          AUTH_SECRET=ci-test-secret-at-least-32-characters-long
          BETTER_AUTH_URL=http://localhost:8787
          ENABLE_PASSWORD_AUTH=true
          EOF

      - name: Apply local D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --local

      - name: Run Playwright e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
