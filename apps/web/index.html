    <!-- Pre-paint bootstrap (theme resolution + transition guard). It is an
         external classic script rather than inline so the document's CSP can
         be `script-src 'self'` with no 'unsafe-inline' — see public/boot.js
         for the why of each step and public/_headers for the policy. The
         `.tt-preload` rule below is the other half of the transition guard. -->
    <style>
      /* Paired with the tt-preload class set by boot.js. `!important` and the
         universal selector are deliberate: this has to outrank every utility
         for the handful of frames it exists, and it is removed before the
         first interaction. */
      .tt-preload * ,
      .tt-preload *::before,
      .tt-preload *::after {
        transition: none !important;
        animation-duration: 0s !important;
      }
    </style>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
