<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracker</title>
    <style>
      /* The web app's DESIGN.md tokens ("The Quiet Ledger" warm-neutral ramp),
         verbatim — the popup only runs in Chrome, so oklch()/color-mix() are safe.
         Keep in sync with src/react-app/index.css :root/.dark. */
      :root {
        --bg: oklch(0.988 0.0015 30);
        --bg-muted: oklch(0.965 0.003 30);
        --fg: oklch(0.22 0.006 30);
        --fg-muted: oklch(0.552 0.008 30);
        --border: oklch(0.912 0.004 30);
        --input-border: oklch(0.912 0.004 30);
        --brand: oklch(0.588 0.207 27.33);
        --accent-bg: color-mix(in oklab, var(--brand) 8%, var(--bg));
        --brand-disabled: color-mix(in oklab, var(--brand) 45%, var(--bg));
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.185 0.006 265);
          --bg-muted: oklch(0.28 0.008 265);
          --fg: oklch(0.96 0.003 265);
          --fg-muted: oklch(0.72 0.012 265);
          --border: oklch(1 0 0 / 9%);
          --input-border: oklch(1 0 0 / 13%);
          --brand: oklch(0.65 0.207 27.33);
          --accent-bg: color-mix(in oklab, var(--brand) 12%, var(--bg));
          --brand-disabled: color-mix(in oklab, var(--brand) 45%, var(--bg));
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { width: 320px; min-height: 200px; font-family: system-ui, sans-serif; font-size: 14px; background: var(--bg); color: var(--fg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
